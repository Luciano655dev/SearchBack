name: Website CI

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:website
