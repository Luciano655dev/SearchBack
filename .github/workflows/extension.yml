name: Extension CI

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extension.yml"

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:extension
      - uses: actions/upload-artifact@v4
        with:
          name: searchback-extension
          path: |
            extension/release/*.zip
            extension/release/*.sha256
